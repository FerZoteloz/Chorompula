<h2>Subir material</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input
        type="text"
        name="title"
        placeholder="Título"
        required
    >

    <textarea
        name="description"
        placeholder="Descripción"
    ></textarea>

    <input
        type="file"
        name="file"
        required
    >

    <button type="submit">
        Subir material
    </button>
</form>
