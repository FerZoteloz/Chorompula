{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Crea una cuenta</h2>
                <p>Registro de estudiante</p>
            </div>

            <p
                id="signupMessage"
                style="
                    display: none;
                    color: #ffb3b3;
                    text-align: center;
                    margin-bottom: 18px;
                    font-weight: 600;
                "
            ></p>
            
            <form class="login-form" id="signupForm" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                        >
                        <label for="email">Correo electrónico</label>
                        <span class="focus-border"></span>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="nombre_pila"
                            name="nombre_pila"
                            required
                        >
                        <label for="nombre_pila">Nombre(s)</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="apellido_paterno"
                            name="apellido_paterno"
                            required
                        >
                        <label for="apellido_paterno">Apellido paterno</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="apellido_materno"
                            name="apellido_materno"
                            required
                        >
                        <label for="apellido_materno">Apellido materno</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="numero_cuenta"
                            name="numero_cuenta"
                            required
                        >
                        <label for="numero_cuenta">Número de cuenta</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password"
                        >
                        <label for="password">Contraseña</label>
                        <span class="focus-border"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="login-btn btn" id="signupButton">
                    <span class="btn-text">Crear cuenta</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div class="divider">
                <span>o inicia sesión aquí</span>
            </div>

            <a href="{% url 'login' %}" class="other-one-btn btn">
                <span class="btn-text">Iniciar sesión</span>
            </a>
        </div>
    </div>

<script>
document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const message = document.getElementById("signupMessage");
    const button = document.getElementById("signupButton");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const nombrePila = document.getElementById("nombre_pila").value.trim();
    const apellidoPaterno = document.getElementById("apellido_paterno").value.trim();
    const apellidoMaterno = document.getElementById("apellido_materno").value.trim();
    const numeroCuenta = document.getElementById("numero_cuenta").value.trim();

    message.style.display = "none";
    message.textContent = "";

    if (
        !email ||
        !password ||
        !nombrePila ||
        !apellidoPaterno ||
        !apellidoMaterno ||
        !numeroCuenta
    ) {
        message.textContent = "Por favor, llena todos los campos.";
        message.style.display = "block";
        return;
    }

    try {
        button.classList.add("loading");

        const response = await fetch("/signup/", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
            },
            body: JSON.stringify({
                email: email,
                password: password,
                nombre_pila: nombrePila,
                apellido_paterno: apellidoPaterno,
                apellido_materno: apellidoMaterno,
                numero_cuenta: numeroCuenta,
                role: "student"
            })
        });

        const data = await response.json();

        if (data.success) {
            message.style.color = "#bbf7d0";
            message.textContent = "Cuenta creada correctamente. Ahora puedes iniciar sesión.";
            message.style.display = "block";

            setTimeout(() => {
                window.location.href = "/login/";
            }, 1200);
        } else {
            message.style.color = "#ffb3b3";
            message.textContent = data.message || "No se pudo crear la cuenta.";
            message.style.display = "block";
        }

    } catch (error) {
        message.style.color = "#ffb3b3";
        message.textContent = "Ocurrió un error al intentar crear la cuenta.";
        message.style.display = "block";
    } finally {
        button.classList.remove("loading");
    }
});
</script>
</body>
</html>
