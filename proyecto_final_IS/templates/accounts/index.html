{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Ingresa a tu cuenta</h2>
                <p>Sistema de Gestión de Cursos de Idiomas</p>
            </div>

            <p
                id="loginMessage"
                style="
                    display: none;
                    color: #ffb3b3;
                    text-align: center;
                    margin-bottom: 18px;
                    font-weight: 600;
                "
            ></p>
            
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                        >
                        <label for="email">Correo electrónico</label>
                        <span class="focus-border"></span>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                        >
                        <label for="password">Contraseña</label>
                        <span class="focus-border"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="login-btn btn" id="loginButton">
                    <span class="btn-text">Ingresar</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div class="divider">
                <span>o crea una cuenta aquí</span>
            </div>

            <a href="{% url 'signup' %}" class="other-one-btn btn">
                <span class="btn-text">Crear cuenta</span>
            </a>
        </div>
    </div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    message.style.display = "none";
    message.textContent = "";

    if (!email || !password) {
        message.textContent = "Por favor, escribe tu correo y contraseña.";
        message.style.display = "block";
        return;
    }

    try {
        button.classList.add("loading");

        const response = await fetch("/login/", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = "/dashboard/";
        } else {
            message.textContent = data.message || "Correo o contraseña incorrectos.";
            message.style.display = "block";
        }

    } catch (error) {
        message.textContent = "Ocurrió un error al intentar iniciar sesión.";
        message.style.display = "block";
    } finally {
        button.classList.remove("loading");
    }
});
</script>
</body>
</html>
